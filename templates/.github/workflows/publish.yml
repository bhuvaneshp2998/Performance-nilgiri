name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Select which script to run'
        required: true
        default: all
        type: choice
        options:
          - test:run
          - smoke
          - all
      test_files:
        description: 'Comma-separated test files (only for test:run)'
        required: false
      ENVIRONMENT:
        description: 'Environment name'
        required: false
        default: qa

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.ENVIRONMENT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Selected Script
        run: |
          if [ "${{ github.event.inputs.script }}" = "test:run" ]; then
            FILES="${{ github.event.inputs.test_files }}"
            if [ -z "$FILES" ]; then
              echo "Please provide test_files input for test:run"
              exit 1
            fi
            npm run test:run -- $FILES --reportDir reports
          else
            npm run ${{ github.event.inputs.script }} --reportDir reports
          fi

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: performance-test-reports
          path: reports/
