apiVersion: 1

datasources:
  - name: InfluxDB K6
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: primary
      defaultBucket: k6
      tlsSkipVerify: false
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
